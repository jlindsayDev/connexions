<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexions</title>

    <style type="text/css">
      * {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        box-sizing: border-box;
      }

      body {
        background: #fafafa;
        color: #000;
        padding: 0;

        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 100%;

        min-height: 100dvh;
        max-width: 500px;
        margin: 0 auto;

        @media (prefers-color-scheme: dark) {
          background-color: #333;
        }
      }

      header,
      nav,
      footer {
        text-align: center;
        padding: 1rem 0rem;
      }
    </style>

    <script defer type="module" src="./calendar.js"></script>
    <script defer type="module" src="./puzzle.js"></script>
  </head>

  <body>
    <header id="header">HEADER</header>

    <main id="root">
      <div id="calendar"></div>
      <div id="puzzle"></div>
    </main>

    <footer id="result">FOOTER</footer>
  </body>

  <script defer type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
      const d = new Date();
      const calendar = document.createElement("calendar-component");
      calendar.year = d.getFullYear();
      calendar.month = d.getMonth();
      document.getElementById("calendar").replaceChildren(calendar);
    });
  </script>
</html>

name: Update DB

# ┌───────────── minute (0 - 59)
# │ ┌───────────── hour (0 - 23)
# │ │ ┌───────────── day of the month (1 - 31)
# │ │ │ ┌───────────── month (1 - 12)
# │ │ │ │ ┌───────────── day of the week (0 - 6)
# │ │ │ │ │
# │ │ │ │ │
# │ │ │ │ │
# * * * * *
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 14 * * 0" # every Sunday at 14:00 UTC (04:00 EST, 07:00 PST)

jobs:
  update_db:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Set Time
        run: echo "TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # https://github.com/marketplace/actions/checkout
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7

      - name: Get Latest Puzzles
        run: node ./scripts/get-puzzles.js

      # - name: Run D1 commands via Wrangler
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #   run: |
      #     npx wrangler d1 execute connexions --remote --file=./puzzles.sql

      # https://github.com/marketplace/actions/deploy-to-cloudflare-workers-with-wrangler
      - name: Import to Cloudflare D1
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute connexions --remote --file=./sql/puzzles.sql
